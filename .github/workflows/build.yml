# Builds usdcc on Windows and Linux against the prebuilt OpenUSD that
# deps-usd.yml publishes, and runs the tests (docs/CI.md §4). vcpkg's packages
# (Qt above all) are kept between runs in vcpkg's files binary cache, saved with
# actions/cache, one per platform.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      mesh_distribution_checks:
        description: Build and smoke-test private Blender distribution candidates (no binary publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Visual Studio 2022, as for the OpenUSD asset (see deps-usd.yml).
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      USD_INSTALL: C:\deps\usd
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # actions/checkout clones submodules at depth 1. A manifest's "overrides"
      # (the Blender mesh backend pins eigen3 3.4.0) make vcpkg read that port's
      # tree from older history, which a shallow clone lacks (docs/CI.md §4).
      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      - name: Name the OpenUSD asset
        id: asset
        run: python tools/ci/usd_asset.py --github-output

      # The Python OpenUSD was built with: its pxrConfig.cmake points at this
      # exact interpreter, and usdcc embeds the same one.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Download OpenUSD
        run: |
          gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) {
            Write-Host "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) for the current deps/usd.json first."
            exit 1
          }
          7z x "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" "-o$env:USD_INSTALL" | Select-Object -Last 2
          if ($LASTEXITCODE) { throw 'unzipping failed' }
          Remove-Item "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}"

      # The USD plugin packs a release ships (file formats, render delegates),
      # unzipped over OpenUSD (docs/USD_PLUGINS.md). One that isn't published is
      # a warning, and usdcc builds without it: after a pin changed,
      # deps-usd-plugins.yml needs a while to catch up.
      - name: Download the USD plugin packs
        run: |
          python tools/fetch_usd.py $env:USD_INSTALL --packs-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # PySide6 built against this Qt (deps-pyside.yml), into external/, where
      # the CMake configure looks for it. Without it, usdcc.ui and the tests of
      # Python-made panels aren't built, so the run still works, with a warning:
      # after a Qt update deps-pyside.yml needs a few minutes to catch up.
      - name: Download PySide6
        run: |
          $asset = python tools/ci/pyside_asset.py | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download $asset.tag --pattern $asset.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) {
            Write-Host "::warning::No $($asset.zip) in release $($asset.tag), so usdcc.ui and the Python panel tests aren't built. Run the PySide6 workflow (deps-pyside.yml)."
            exit 0
          }
          7z x "$env:RUNNER_TEMP\$($asset.zip)" -oexternal | Select-Object -Last 2
          if ($LASTEXITCODE) { throw 'unzipping failed' }
          Remove-Item "$env:RUNNER_TEMP\$($asset.zip)"

      # The newest cache for the same dependencies is restored, or else the
      # newest of any, so only what changed gets built (tools/ci/vcpkg_cache.py).
      # A run that built something saves under a key of its own, so a run that
      # stopped halfway can't leave a key behind that later runs would hit
      # without ever saving what they built.
      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Note the cached packages
        run: |
          $zips = @(Get-ChildItem -Recurse -File -Filter *.zip '${{ steps.vcpkg.outputs.dir }}' | ForEach-Object Name)
          Set-Content "$env:RUNNER_TEMP\vcpkg-cache-before.txt" $zips
          Write-Host "$($zips.Count) package(s) in the cache"

      - name: Build
        id: build
        run: python tools/build.py --usd-install $env:USD_INSTALL --without-rtx

      # A crash on a hosted runner can sit behind an error dialog nobody closes,
      # so every test executable gets a timeout. Verbose, so the log shows each
      # test case and the check counts, not just three "Passed".
      - name: Test
        run: |
          ctest --test-dir build -C RelWithDebInfo --verbose --timeout 900
          if ($LASTEXITCODE) { throw 'tests failed' }

      - name: Blender distribution candidate checks
        if: github.event_name == 'workflow_dispatch' && inputs.mesh_distribution_checks
        run: |
          python tools/deploy.py build/blender-candidate --with-blender-mesh-tools
          if ($LASTEXITCODE) { throw 'candidate deployment failed' }
          python tools/ci/blender_mesh_smoke_test.py --deploy build/blender-candidate --platform-plugins build/vcpkg_installed/x64-windows/Qt6/plugins/platforms
          if ($LASTEXITCODE) { throw 'candidate smoke test failed' }
          python tools/benchmark_blender_mesh.py
          if ($LASTEXITCODE) { throw 'benchmark failed' }

      - name: Blender verification reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mesh_distribution_checks
        uses: actions/upload-artifact@v4
        with:
          name: blender-verification-windows
          path: |
            build/blender-packaged-smoke/*.json
            build/blender-packaged-smoke/*.log
            build/blender-mesh-benchmark.json
            build/blender-candidate/distribution-readiness.json

      # After a successful build, drops the packages it didn't use (an older
      # compiler's, a replaced port's), which would otherwise be carried from
      # cache to cache for ever: each installed package's vcpkg_abi_info.txt
      # hashes to its zip's name. Every install tree counts, every triplet in
      # it: usdcc's and the Blender mesh backend's (its own manifest, with
      # eigen3 3.4.0). After a failed build, vcpkg may not have got to every
      # package, so nothing is dropped.
      - name: Prune the vcpkg cache
        id: vcpkg-prune
        if: always() && steps.vcpkg.outputs.key != ''
        run: |
          $dir = '${{ steps.vcpkg.outputs.dir }}'
          $installed = @('build\vcpkg_installed', 'external\blender-work\build\vcpkg_installed' |
            Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Directory } |
            ForEach-Object { Join-Path $_.FullName share } | Where-Object { Test-Path $_ })
          if ('${{ steps.build.outcome }}' -eq 'success' -and $installed.Count -gt 0) {
            $used = @(Get-ChildItem $installed -Recurse -Filter vcpkg_abi_info.txt |
              ForEach-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() + '.zip' } |
              Sort-Object -Unique)
            $unused = @(Get-ChildItem -Recurse -File -Filter *.zip $dir | Where-Object { $used -notcontains $_.Name })
            $unused | Remove-Item
            Write-Host "$($used.Count) package(s) used, $($unused.Count) unused one(s) dropped"
          }
          $zips = @(Get-ChildItem -Recurse -File -Filter *.zip $dir)
          $before = @(Get-Content "$env:RUNNER_TEMP\vcpkg-cache-before.txt" -ErrorAction SilentlyContinue)
          $added = @($zips | Where-Object { $before -notcontains $_.Name })
          Write-Host "$($added.Count) package(s) built and added"
          "added=$(($added.Count -gt 0).ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # Whenever vcpkg built something, even if usdcc's build failed afterwards,
      # so Qt (over an hour) isn't built again. Only from master: a pull
      # request's caches would crowd master's out of the 10 GB the repository
      # gets, and pull requests restore master's.
      - name: Save the vcpkg cache
        if: always() && github.event_name != 'pull_request' && steps.vcpkg-prune.outputs.added == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}

      - name: Upload vcpkg's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: |
            external/vcpkg/buildtrees/**/*.log
            build/vcpkg-manifest-install.log
          if-no-files-found: ignore

  # The same on Ubuntu 24.04 with GCC 13 (docs/LINUX_WSL.md). No PySide6 yet
  # (tools/build_pyside.py is Windows only), so usdcc.ui and the Python panel
  # tests aren't built here. The tests run headless: Xvfb, with Mesa's llvmpipe.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # See the Windows job: vcpkg's overrides need its full history.
      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      # Qt's sources and build in vcpkg's buildtrees need the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # What vcpkg's Qt needs from the system (X11, xcb, GL, Wayland), Ninja,
      # and Xvfb for the tests (docs/LINUX_WSL.md §1). With apt's recommended
      # packages, as there: vcpkg's libxcrypt needs libltdl-dev, which libtool recommends.
      - name: Install the build's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build pkg-config autoconf autoconf-archive automake libltdl-dev \
            libtool bison flex gperf nasm zip unzip xvfb mesa-utils \
            libgl-dev libegl-dev libegl1-mesa-dev libglu1-mesa-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxi-dev libxt-dev libxtst-dev libxrandr-dev libxcursor-dev libxinerama-dev libsm-dev libice-dev \
            libxkbcommon-dev libxkbcommon-x11-dev '^libxcb.*-dev' libfontconfig1-dev libfreetype-dev libdbus-1-dev \
            libwayland-dev wayland-protocols libwayland-bin

      - name: Name the OpenUSD asset
        id: asset
        run: python3 tools/ci/usd_asset.py --github-output

      # The Python OpenUSD was built with, at the same path: pxrConfig.cmake
      # names it, and usdcc embeds it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Download OpenUSD
        run: |
          if ! gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir "$RUNNER_TEMP"; then
            echo "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) for the current deps/usd.json first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deps"  # unzip makes only the last folder
          unzip -q "$RUNNER_TEMP/${{ steps.asset.outputs.zip }}" -d "$RUNNER_TEMP/deps/usd"
          rm "$RUNNER_TEMP/${{ steps.asset.outputs.zip }}"
          echo "USD_INSTALL=$RUNNER_TEMP/deps/usd" >> "$GITHUB_ENV"

      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Note the cached packages
        run: |
          find '${{ steps.vcpkg.outputs.dir }}' -name '*.zip' -printf '%f\n' | sort > "$RUNNER_TEMP/vcpkg-cache-before.txt"
          echo "$(wc -l < "$RUNNER_TEMP/vcpkg-cache-before.txt") package(s) in the cache"

      - name: Build
        id: build
        run: python tools/build.py --usd-install "$USD_INSTALL" --without-rtx

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir build --verbose --timeout 900

      - name: Blender distribution candidate checks
        if: github.event_name == 'workflow_dispatch' && inputs.mesh_distribution_checks
        run: |
          python tools/deploy.py build/blender-candidate --with-blender-mesh-tools
          python tools/ci/blender_mesh_smoke_test.py --deploy build/blender-candidate
          python tools/benchmark_blender_mesh.py

      - name: Blender verification reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mesh_distribution_checks
        uses: actions/upload-artifact@v4
        with:
          name: blender-verification-linux
          path: |
            build/blender-packaged-smoke/*.json
            build/blender-packaged-smoke/*.log
            build/blender-mesh-benchmark.json
            build/blender-candidate/distribution-readiness.json

      # As the windows job's: after a successful build, drops the packages it
      # didn't use; each installed package's vcpkg_abi_info.txt hashes to its zip's name.
      # Every triplet counts: Qt's host tools are built for x64-linux, beside
      # x64-linux-dynamic, and the Blender mesh backend has an install tree of its own.
      - name: Prune the vcpkg cache
        id: vcpkg-prune
        if: always() && steps.vcpkg.outputs.key != ''
        run: |
          dir='${{ steps.vcpkg.outputs.dir }}'
          installed=$(ls -d build/vcpkg_installed/*/share external/blender-work/build/vcpkg_installed/*/share 2>/dev/null || true)
          if [ '${{ steps.build.outcome }}' = success ] && [ -n "$installed" ]; then
            find $installed -name vcpkg_abi_info.txt -exec sha256sum {} + | awk '{print $1 ".zip"}' | sort -u > "$RUNNER_TEMP/used.txt"
            unused=0
            while IFS= read -r zip; do
              if ! grep -qxF "$(basename "$zip")" "$RUNNER_TEMP/used.txt"; then rm "$zip"; unused=$((unused + 1)); fi
            done < <(find "$dir" -name '*.zip')
            echo "$(wc -l < "$RUNNER_TEMP/used.txt") package(s) used, $unused unused one(s) dropped"
          fi
          find "$dir" -name '*.zip' -printf '%f\n' | sort > "$RUNNER_TEMP/vcpkg-cache-after.txt"
          added=$(comm -13 "$RUNNER_TEMP/vcpkg-cache-before.txt" "$RUNNER_TEMP/vcpkg-cache-after.txt" | wc -l)
          echo "$added package(s) built and added"
          if [ "$added" -gt 0 ]; then echo "added=true" >> "$GITHUB_OUTPUT"; else echo "added=false" >> "$GITHUB_OUTPUT"; fi

      - name: Save the vcpkg cache
        if: always() && github.event_name != 'pull_request' && steps.vcpkg-prune.outputs.added == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}

      - name: Upload vcpkg's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-linux
          path: |
            external/vcpkg/buildtrees/**/*.log
            build/vcpkg-manifest-install.log
          if-no-files-found: ignore
