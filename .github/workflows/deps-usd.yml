# Builds OpenUSD as deps/usd.json pins it and publishes the install as a
# prerelease asset, which usdcc's CI downloads and plugin authors build against
# (docs/CI.md). Slow (hours), so it only runs when the pin changes or by hand,
# and skips the build when the asset for the current pin already exists.
name: OpenUSD

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Build again and replace the asset if it's already published
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - deps/usd.json
      - deps/patches/**
      - tools/ci/usd-asset.ps1
      - tools/ci/relocate-usd.ps1
      - tools/ci/usd-licenses.ps1
      - tools/ci/usd-sdk-check/**
      - .github/workflows/deps-usd.yml

permissions:
  contents: write  # publishing the release

concurrency:
  group: deps-usd
  cancel-in-progress: false

jobs:
  openusd:
    # Pinned, never windows-latest: windows-2025 has moved to Visual Studio 2026,
    # and the build has to use the same toolset as usdcc (Visual Studio 2022).
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      USD_INSTALL: C:\deps\usd
      WORK: C:\b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the asset
        id: asset
        run: tools/ci/usd-asset.ps1 -GitHubOutput

      - name: Check whether it's already published
        id: published
        run: |
          $names = gh release view '${{ steps.asset.outputs.tag }}' --json assets --jq '.assets[].name' 2>$null
          $found = $LASTEXITCODE -eq 0 -and @($names) -contains '${{ steps.asset.outputs.zip }}'
          "exists=$(($LASTEXITCODE -eq 0).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($found -and '${{ inputs.replace }}' -eq 'true') {
            Write-Host "::notice::${{ steps.asset.outputs.zip }} is published; building it again to replace it."
            $found = $false
          }
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($found) { Write-Host "::notice::${{ steps.asset.outputs.zip }} is already published; nothing to build." }
          exit 0

      - name: Set up Python
        if: steps.published.outputs.found != 'true'
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Show free disk space
        if: steps.published.outputs.found != 'true'
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB'; e={[math]::Round($_.Free / 1GB)}}, @{n='Used GB'; e={[math]::Round($_.Used / 1GB)}}

      - name: Fetch OpenUSD
        if: steps.published.outputs.found != 'true'
        run: |
          $src = "$env:WORK\OpenUSD"
          git init -q $src
          git -C $src config core.autocrlf false
          git -C $src remote add origin '${{ steps.asset.outputs.repository }}'
          git -C $src fetch --depth 1 origin '${{ steps.asset.outputs.commit }}'
          if ($LASTEXITCODE) { throw 'fetch failed' }
          git -C $src checkout -q FETCH_HEAD
          foreach ($patch in '${{ steps.asset.outputs.patches }}'.Split(';')) {
            git -C $src apply --verbose $patch
            if ($LASTEXITCODE) { throw "$patch doesn't apply" }
          }

      - name: Build OpenUSD
        if: steps.published.outputs.found != 'true'
        run: |
          $spec = Get-Content -Raw deps/usd.json | ConvertFrom-Json
          python "$env:WORK\OpenUSD\build_scripts\build_usd.py" @($spec.flags) `
            --src "$env:WORK\src" --build "$env:WORK\build" $env:USD_INSTALL
          if ($LASTEXITCODE) {
            Get-Content "$env:WORK\src\log.txt" -Tail 200 -ErrorAction SilentlyContinue
            throw "build_usd.py failed ($LASTEXITCODE)"
          }

      - name: Upload the build log
        if: failure() && steps.published.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build_usd-log
          path: |
            C:\b\src\log.txt
            C:\b\build\**\log.txt
          if-no-files-found: ignore

      # The licences of the libraries build_usd.py built, which only their
      # source and build folders have (docs/RELEASE.md section 6).
      - name: Collect the licences
        if: steps.published.outputs.found != 'true'
        run: |
          tools/ci/usd-licenses.ps1 -Src "$env:WORK\src" -Build "$env:WORK\build" -Destination "$env:USD_INSTALL\licenses"
          if (@(Get-ChildItem -Directory "$env:USD_INSTALL\licenses").Count -lt 10) { throw 'Fewer licences than expected' }

      - name: Make it relocatable
        if: steps.published.outputs.found != 'true'
        run: |
          foreach ($dir in 'src', 'build') {
            $path = Join-Path $env:USD_INSTALL $dir
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
          tools/ci/relocate-usd.ps1 -Install $env:USD_INSTALL

      - name: Zip it
        if: steps.published.outputs.found != 'true'
        run: |
          $zip = "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}"
          7z a -tzip -mx=5 $zip "$env:USD_INSTALL\*" | Select-Object -Last 3
          if ($LASTEXITCODE) { throw '7z failed' }
          $size = (Get-Item $zip).Length
          Write-Host ("{0:N0} MB" -f ($size / 1MB))
          if ($size -ge 2GB) { throw 'Over GitHub''s 2 GiB per-asset limit' }

      # From a different folder than it was built in, with the original gone, so
      # a path relocate-usd.ps1 missed can't quietly still work.
      - name: Check it as an SDK
        if: steps.published.outputs.found != 'true'
        run: |
          Remove-Item -Recurse -Force $env:USD_INSTALL
          $sdk = "$env:RUNNER_TEMP\usd-sdk"
          7z x "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" "-o$sdk" | Select-Object -Last 2
          $build = "$env:RUNNER_TEMP\usd-sdk-check"
          cmake -S tools/ci/usd-sdk-check -B $build -G 'Visual Studio 17 2022' -A x64 "-DUSD_INSTALL=$sdk"
          if ($LASTEXITCODE) { throw 'configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE) { throw 'build failed' }
          ctest --test-dir $build -C Release --output-on-failure -V
          if ($LASTEXITCODE) { throw 'check failed' }

      - name: Publish
        if: steps.published.outputs.found != 'true'
        run: |
          $spec = Get-Content -Raw deps/usd.json | ConvertFrom-Json
          $notes = @"
          Prebuilt OpenUSD for usdcc's CI and for usdcc plugin authors (docs/CI.md). Not a usdcc release.

          - Source: $($spec.repository) at ``$($spec.commit)``
          - Patches: $($spec.patches -join ', ')
          - ``build_usd.py`` flags: ``$($spec.flags -join ' ')``
          - Python $($spec.python) x64, Visual Studio 2022 (runner image ``windows-2022``)
          - Built by $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID from ``$env:GITHUB_SHA``

          Includes the licences of OpenUSD's dependencies in ``licenses/``.

          Release only: plugins must use the release CRT (``/MD``) and ``_ITERATOR_DEBUG_LEVEL=0`` in every configuration.
          Unzip anywhere and pass ``-DUSD_INSTALL=<folder>`` (docs/PLUGIN_SDK.md).
          "@
          if ('${{ steps.published.outputs.exists }}' -eq 'true') {
            # Replacing (the replace input): same name, same pin, so build.yml
            # goes on using it throughout.
            gh release upload '${{ steps.asset.outputs.tag }}' "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" --clobber
            if ($LASTEXITCODE) { throw 'replacing the asset failed' }
            gh release edit '${{ steps.asset.outputs.tag }}' --notes $notes
          } else {
            gh release create '${{ steps.asset.outputs.tag }}' "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" `
              --prerelease --target $env:GITHUB_SHA `
              --title 'OpenUSD ${{ steps.asset.outputs.name }}' --notes $notes
          }
          if ($LASTEXITCODE) { throw 'publishing failed' }
