# Builds OpenUSD as deps/usd.json pins it and publishes the install as a
# prerelease asset, which usdcc's CI downloads and plugin authors build against
# (docs/CI.md). Slow (hours), so it only runs when the pin changes or by hand,
# and each job skips the build when its asset for the current pin already
# exists. One zip per platform (win64, win-arm64, linux-x64, linux-arm64), in the
# same release.
name: OpenUSD

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Build again and replace the asset if it's already published
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - deps/usd.json
      - deps/patches/**
      - tools/ci/usd_asset.py
      - tools/ci/relocate_usd.py
      - tools/build_usd.py
      - tools/_elf.py
      - tools/ci/usd_licenses.py
      - tools/ci/usd-sdk-check/**
      - .github/workflows/deps-usd.yml

permissions:
  contents: write  # publishing the release

concurrency:
  group: deps-usd
  cancel-in-progress: false

jobs:
  # Once per architecture: tools/_common.py names the asset win64 or win-arm64 by
  # the machine. The windows-11-arm image has Visual Studio 2022 too.
  windows:
    # Pinned, never windows-latest: windows-2025 has moved to Visual Studio 2026,
    # and the build has to use the same toolset as usdcc (Visual Studio 2022).
    name: windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            vs_arch: x64
            log: build_usd-log
          - arch: arm64
            runner: windows-11-arm
            vs_arch: ARM64
            log: build_usd-log-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      USD_INSTALL: C:\deps\usd
      WORK: C:\b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The tools run on the image's own Python before setup-python; on the Arm
      # image that has to be an arm64 one, or they'd name the x64 asset.
      # 3.12, not 3.13: Python's installer won't put the pinned 3.13.x beside a
      # newer 3.13 that's already installed.
      - name: Set up Python for the tools
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Name the asset
        id: asset
        run: python tools/ci/usd_asset.py --github-output

      - name: Check whether it's already published
        id: published
        run: |
          $names = gh release view '${{ steps.asset.outputs.tag }}' --json assets --jq '.assets[].name' 2>$null
          $found = $LASTEXITCODE -eq 0 -and @($names) -contains '${{ steps.asset.outputs.zip }}'
          "exists=$(($LASTEXITCODE -eq 0).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($found -and '${{ inputs.replace }}' -eq 'true') {
            Write-Host "::notice::${{ steps.asset.outputs.zip }} is published; building it again to replace it."
            $found = $false
          }
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($found) { Write-Host "::notice::${{ steps.asset.outputs.zip }} is already published; nothing to build." }
          exit 0

      # The windows-11-arm image ships a newer Python 3.13 than the pin, and
      # Python's installer won't put an older 3.13 beside it, so setup-python
      # fails. Uninstalling the image's (its MSIs) first lets the pinned one install.
      - name: Remove the image's Python of the pinned minor version
        if: matrix.arch == 'arm64' && steps.published.outputs.found != 'true'
        run: |
          $pin = '${{ steps.asset.outputs.python }}'
          $minor = ($pin -split '\.')[0..1] -join '\.'
          $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $all = @(Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Python *' })
          $all | ForEach-Object { Write-Host "Installed: $($_.DisplayName) $($_.DisplayVersion)" }
          # Each part (Core Interpreter, Standard Library, ...) is an MSI of its own,
          # whose registry key is its product code.
          $parts = @($all | Where-Object {
            $_.DisplayName -match "^Python $minor\.\d+ .*\(ARM64\)$" -and $_.DisplayName -notmatch "^Python $([regex]::Escape($pin)) " -and
            $_.PSChildName -match '^\{[0-9A-Fa-f-]+\}$' })
          foreach ($part in $parts) {
            Write-Host "Uninstalling $($part.DisplayName)"
            $exit = (Start-Process msiexec -ArgumentList '/x', $part.PSChildName, '/qn', '/norestart' -Wait -PassThru).ExitCode
            # 1605: already gone with another part; 3010: needs a restart, which it doesn't here.
            # A part that won't go (1603 for the Test Suite) is a warning: setup-python says whether what's left is in the way.
            if ($exit -notin 0, 1605, 3010) { Write-Host "::warning::uninstalling $($part.DisplayName) failed ($exit)" }
          }
          if (-not $parts) { Write-Host "No other Python $($pin -replace '\.\d+$') release to remove" }
          exit 0

      - name: Set up Python
        if: steps.published.outputs.found != 'true'
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}
          architecture: ${{ matrix.arch }}

      - name: Show free disk space
        if: steps.published.outputs.found != 'true'
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB'; e={[math]::Round($_.Free / 1GB)}}, @{n='Used GB'; e={[math]::Round($_.Used / 1GB)}}

      - name: Fetch OpenUSD
        if: steps.published.outputs.found != 'true'
        run: |
          $src = "$env:WORK\OpenUSD"
          git init -q $src
          git -C $src config core.autocrlf false
          git -C $src remote add origin '${{ steps.asset.outputs.repository }}'
          git -C $src fetch --depth 1 origin '${{ steps.asset.outputs.commit }}'
          if ($LASTEXITCODE) { throw 'fetch failed' }
          git -C $src checkout -q FETCH_HEAD
          foreach ($patch in '${{ steps.asset.outputs.patches }}'.Split(';')) {
            git -C $src apply --verbose $patch
            if ($LASTEXITCODE) { throw "$patch doesn't apply" }
          }

      - name: Build OpenUSD
        if: steps.published.outputs.found != 'true'
        run: |
          # deps/usd.json's flags as tools/ci/usd_asset.py adapts them (--onetbb on ARM64).
          $flags = python -c "import json, sys; sys.path.insert(0, 'tools/ci'); import usd_asset; print(json.dumps(usd_asset.platform_flags(json.load(open('deps/usd.json'))['flags'])))" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'no flags' }
          python "$env:WORK\OpenUSD\build_scripts\build_usd.py" @($flags) `
            --src "$env:WORK\src" --build "$env:WORK\build" $env:USD_INSTALL
          if ($LASTEXITCODE) {
            Get-Content "$env:WORK\src\log.txt" -Tail 200 -ErrorAction SilentlyContinue
            throw "build_usd.py failed ($LASTEXITCODE)"
          }

      - name: Upload the build log
        if: failure() && steps.published.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.log }}
          path: |
            C:\b\src\log.txt
            C:\b\build\**\log.txt
          if-no-files-found: ignore

      # The licences of the libraries build_usd.py built, which only their
      # source and build folders have (docs/RELEASE.md section 6).
      - name: Collect the licences
        if: steps.published.outputs.found != 'true'
        run: |
          python tools/ci/usd_licenses.py --src "$env:WORK\src" --build "$env:WORK\build" --destination "$env:USD_INSTALL\licenses" --openusd-source "$env:WORK\OpenUSD"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (@(Get-ChildItem -Directory "$env:USD_INSTALL\licenses").Count -lt 10) { throw 'Fewer licences than expected' }

      - name: Make it relocatable
        if: steps.published.outputs.found != 'true'
        run: |
          foreach ($dir in 'src', 'build') {
            $path = Join-Path $env:USD_INSTALL $dir
            if (Test-Path $path) { Remove-Item -Recurse -Force $path }
          }
          python tools/ci/relocate_usd.py --install $env:USD_INSTALL

      - name: Zip it
        if: steps.published.outputs.found != 'true'
        run: |
          $zip = "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}"
          7z a -tzip -mx=5 $zip "$env:USD_INSTALL\*" | Select-Object -Last 3
          if ($LASTEXITCODE) { throw '7z failed' }
          $size = (Get-Item $zip).Length
          Write-Host ("{0:N0} MB" -f ($size / 1MB))
          if ($size -ge 2GB) { throw 'Over GitHub''s 2 GiB per-asset limit' }

      # From a different folder than it was built in, with the original gone, so
      # a path relocate_usd.py missed can't quietly still work.
      - name: Check it as an SDK
        if: steps.published.outputs.found != 'true'
        run: |
          Remove-Item -Recurse -Force $env:USD_INSTALL
          $sdk = "$env:RUNNER_TEMP\usd-sdk"
          7z x "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" "-o$sdk" | Select-Object -Last 2
          $build = "$env:RUNNER_TEMP\usd-sdk-check"
          cmake -S tools/ci/usd-sdk-check -B $build -G 'Visual Studio 17 2022' -A ${{ matrix.vs_arch }} "-DUSD_INSTALL=$sdk"
          if ($LASTEXITCODE) { throw 'configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE) { throw 'build failed' }
          ctest --test-dir $build -C Release --output-on-failure -V
          if ($LASTEXITCODE) { throw 'check failed' }

      - name: Publish
        if: steps.published.outputs.found != 'true'
        run: |
          $spec = Get-Content -Raw deps/usd.json | ConvertFrom-Json
          $notes = @"
          Prebuilt OpenUSD for usdcc's CI and for usdcc plugin authors (docs/CI.md). Not a usdcc release.

          - Source: $($spec.repository) at ``$($spec.commit)``
          - Patches: $($spec.patches -join ', ')
          - ``build_usd.py`` flags: ``$($spec.flags -join ' ')`` (on Linux without ``--generator``)
          - ``win64``: Python $($spec.python) x64, Visual Studio 2022 (runner image ``windows-2022``)
          - ``win-arm64``: Python $($spec.python) arm64, Visual Studio 2022, with ``--onetbb`` (runner image ``windows-11-arm``)
          - ``linux-x64``: Python $($spec.python) from actions/setup-python, GCC 13 (runner image ``ubuntu-24.04``)
          - ``linux-arm64``: the same on aarch64 (runner image ``ubuntu-24.04-arm``)
          - Built by $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID from ``$env:GITHUB_SHA``

          Includes the licences of OpenUSD's dependencies in ``licenses/``.

          Release only: plugins must use the release CRT (``/MD``) and ``_ITERATOR_DEBUG_LEVEL=0`` in every configuration.
          Unzip anywhere and pass ``-DUSD_INSTALL=<folder>`` (docs/PLUGIN_SDK.md).
          "@
          if ('${{ steps.published.outputs.exists }}' -eq 'true') {
            # Replacing (the replace input): same name, same pin, so build.yml
            # goes on using it throughout.
            gh release upload '${{ steps.asset.outputs.tag }}' "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" --clobber
            if ($LASTEXITCODE) { throw 'replacing the asset failed' }
            gh release edit '${{ steps.asset.outputs.tag }}' --notes $notes
          } else {
            gh release create '${{ steps.asset.outputs.tag }}' "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" `
              --prerelease --target $env:GITHUB_SHA `
              --title 'OpenUSD ${{ steps.asset.outputs.base }}' --notes $notes
            if ($LASTEXITCODE) {
              # Another job made the release meanwhile: add to it.
              gh release upload '${{ steps.asset.outputs.tag }}' "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" --clobber
              if (-not $LASTEXITCODE) { gh release edit '${{ steps.asset.outputs.tag }}' --notes $notes }
            }
          }
          if ($LASTEXITCODE) { throw 'publishing failed' }

  # The same OpenUSD for Linux, with tools/build_usd.py (the steps above, as a
  # script), against actions/setup-python's CPython, which build.yml's and
  # release.yml's linux jobs set up at the same path. Once per architecture:
  # tools/_common.py names the asset linux-x64 or linux-arm64 by the machine.
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the asset
        id: asset
        run: python3 tools/ci/usd_asset.py --github-output

      - name: Check whether it's already published
        id: published
        run: |
          names=$(gh release view '${{ steps.asset.outputs.tag }}' --json assets --jq '.assets[].name' 2>/dev/null) && exists=true || exists=false
          found=false
          if $exists && grep -qx '${{ steps.asset.outputs.zip }}' <<< "$names"; then found=true; fi
          if $found && [ '${{ inputs.replace }}' = true ]; then
            echo "::notice::${{ steps.asset.outputs.zip }} is published; building it again to replace it."
            found=false
          fi
          $found && echo "::notice::${{ steps.asset.outputs.zip }} is already published; nothing to build."
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # The image's preinstalled SDKs leave too little room for OpenUSD and its
      # dependencies' sources and builds.
      - name: Free disk space
        if: steps.published.outputs.found != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the build's packages
        if: steps.published.outputs.found != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake ninja-build nasm patchelf zip unzip \
            libgl-dev libegl-dev libglu1-mesa-dev libx11-dev libxt-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev

      - name: Set up Python
        if: steps.published.outputs.found != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Build OpenUSD
        if: steps.published.outputs.found != 'true'
        run: |
          echo "USD_INSTALL=$RUNNER_TEMP/deps/usd" >> "$GITHUB_ENV"
          python tools/build_usd.py "$RUNNER_TEMP/deps/usd" --work "$RUNNER_TEMP/b"
          if [ "$(ls "$RUNNER_TEMP/deps/usd/licenses" | wc -l)" -lt 10 ]; then
            echo "::error::Fewer licences than expected"; exit 1
          fi

      - name: Upload the build log
        if: failure() && steps.published.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build_usd-log-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/b/src/log.txt
            ${{ runner.temp }}/b/build/**/log.txt
          if-no-files-found: ignore

      # The CMake files and the ELF files' RUNPATHs (docs/CI.md section 2).
      - name: Make it relocatable
        if: steps.published.outputs.found != 'true'
        run: python tools/ci/relocate_usd.py --install "$USD_INSTALL"

      # --symlinks: libfoo.so -> libfoo.so.1 stay links, which unzip restores.
      - name: Zip it
        if: steps.published.outputs.found != 'true'
        run: |
          zip_file="$RUNNER_TEMP/${{ steps.asset.outputs.zip }}"
          (cd "$USD_INSTALL" && zip -q -r -y -6 "$zip_file" .)
          size=$(stat -c %s "$zip_file")
          echo "$((size / 1048576)) MB"
          if [ "$size" -ge 2147483648 ]; then echo "::error::Over GitHub's 2 GiB per-asset limit"; exit 1; fi

      # From a different folder than it was built in, with the original gone.
      - name: Check it as an SDK
        if: steps.published.outputs.found != 'true'
        run: |
          rm -rf "$USD_INSTALL" "$RUNNER_TEMP/b"
          sdk="$RUNNER_TEMP/usd-sdk"
          unzip -q "$RUNNER_TEMP/${{ steps.asset.outputs.zip }}" -d "$sdk"
          build="$RUNNER_TEMP/usd-sdk-check"
          cmake -S tools/ci/usd-sdk-check -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DUSD_INSTALL=$sdk"
          cmake --build "$build"
          # Nothing of the build machine's: no LD_LIBRARY_PATH, no PYTHONPATH.
          env -i PATH=/usr/bin:/bin HOME="$HOME" ctest --test-dir "$build" --output-on-failure -V

      - name: Publish
        if: steps.published.outputs.found != 'true'
        run: |
          tag='${{ steps.asset.outputs.tag }}'
          zip_file="$RUNNER_TEMP/${{ steps.asset.outputs.zip }}"
          # The windows job writes the release's notes; this only adds its zip,
          # making the release if it isn't there yet.
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" "$zip_file" --prerelease --target "$GITHUB_SHA" \
              --title 'OpenUSD ${{ steps.asset.outputs.base }}' \
              --notes "Prebuilt OpenUSD for usdcc's CI and for usdcc plugin authors (docs/CI.md). Not a usdcc release." && exit 0
          fi
          gh release upload "$tag" "$zip_file" --clobber
