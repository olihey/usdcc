# Builds a GitHub release's Windows 7z and Linux tar.xz and attaches them
# (docs/RELEASE.md §4): publish a release (or prerelease) with a tag such as
# v0.2.0, and this builds that tag on each platform, runs the tests, deploys,
# starts the deploy as a user would, and attaches
# usdcc-<version>-windows-x64.7z and usdcc-<version>-linux-x64.tar.xz, each
# with its symbols. Run it by hand with the tag to rebuild a release whose run
# failed.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.2.0
        required: true
        type: string

permissions:
  contents: write  # attaching the archives

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    # Visual Studio 2022, as for build.yml and the deps assets.
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      USD_INSTALL: C:\deps\usd
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          if ($env:TAG -notmatch '^v?(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            Write-Host "::error::The tag '$env:TAG' isn't a version, such as 0.2.0, v0.2.0 or 0.2.0-beta.1."
            exit 1
          }
          $version = $Matches[1]
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          if ($LASTEXITCODE) {
            Write-Host "::error::There's no release with the tag $env:TAG to attach the archives to."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=usdcc-$version" >> $env:GITHUB_OUTPUT
          "archive=usdcc-$version-windows-x64.7z" >> $env:GITHUB_OUTPUT
          "symbols=usdcc-$version-windows-x64-symbols.7z" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          submodules: recursive

      # As build.yml: the Blender mesh backend's eigen3 override makes vcpkg
      # read older port history than the depth-1 submodule clone has.
      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      - name: Name the OpenUSD asset
        id: asset
        run: python tools/ci/usd_asset.py --github-output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Download OpenUSD
        run: |
          gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) {
            Write-Host "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) first."
            exit 1
          }
          7z x "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" "-o$env:USD_INSTALL" | Select-Object -Last 2
          if ($LASTEXITCODE) { throw 'unzipping failed' }

      # Required here, unlike in build.yml: a release without it couldn't make
      # panels from Python.
      - name: Download PySide6
        run: |
          $asset = python tools/ci/pyside_asset.py | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download $asset.tag --pattern $asset.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) {
            Write-Host "::error::No $($asset.zip) in release $($asset.tag). Run the PySide6 workflow (deps-pyside.yml) first."
            exit 1
          }
          7z x "$env:RUNNER_TEMP\$($asset.zip)" -oexternal | Select-Object -Last 2
          if ($LASTEXITCODE) { throw 'unzipping failed' }

      # build.yml's cache, only read: build.yml keeps it.
      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py --access read

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Build
        run: python tools/build.py --usd-install $env:USD_INSTALL --without-rtx --usdcc-version ${{ steps.tag.outputs.version }}

      - name: Test
        run: |
          ctest --test-dir build -C RelWithDebInfo --output-on-failure --timeout 900
          if ($LASTEXITCODE) { throw 'tests failed' }

      - name: Deploy
        run: |
          $deploy = "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}"
          python tools/deploy.py $deploy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A release has to ship every licence (docs/RELEASE.md section 6).
          foreach ($folder in 'OpenUSD-dependencies', 'PySide6', 'vcpkg') {
            if (-not (Get-ChildItem "$deploy\licenses\$folder" -ErrorAction SilentlyContinue)) {
              throw "No licences in licenses\$folder"
            }
          }

      - name: Start the deploy
        run: |
          python tools/ci/smoke_test.py --deploy "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}" `
            --expect-version ${{ steps.tag.outputs.version }} `
            --platform-plugins build\vcpkg_installed\x64-windows\Qt6\plugins\platforms

      # The deploy, in a folder of its own; and the PDBs of usdcc's own
      # programs and libraries, laid out as they are in the deploy, for reading
      # a crash dump from that release. 7z at its strongest: LZMA2 with a
      # 256 MB dictionary, one solid block with the files sorted by type, so
      # the DLLs compress against each other (7-Zip adds its x86 filter for
      # them). Unpacking takes about 256 MB of memory.
      - name: Pack it
        run: |
          $pack = @('a', '-t7z', '-mx=9', '-md=256m', '-mfb=273', '-ms=on', '-mqs=on', '-mmt=on')
          $deploy = "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}"
          Push-Location $env:RUNNER_TEMP
          7z @pack '${{ steps.tag.outputs.archive }}' '${{ steps.tag.outputs.name }}' | Select-Object -Last 3
          if ($LASTEXITCODE) { throw '7z failed' }
          Pop-Location

          $symbols = "$env:RUNNER_TEMP\symbols\${{ steps.tag.outputs.name }}-symbols"
          $pdbs = @(Get-ChildItem build -Recurse -Filter *.pdb |
            Where-Object { $_.FullName -notmatch '\\(vcpkg_installed|CMakeFiles|tests)\\' -and $_.FullName -notmatch '\.dir\\' })
          $count = 0
          foreach ($binary in Get-ChildItem $deploy -Recurse -Include *.exe, *.dll, *.pyd) {
            # OpenUSD's pxr has an _usd.pyd too; of the Python packages, only usdcc's are ours.
            if ($binary.FullName -match '\\site-packages\\' -and $binary.FullName -notmatch '\\site-packages\\usdcc\\') { continue }
            $pdb = $pdbs | Where-Object { $_.BaseName -eq $binary.BaseName } | Select-Object -First 1
            if (-not $pdb) { continue }
            $to = Join-Path $symbols ([IO.Path]::GetDirectoryName($binary.FullName.Substring($deploy.Length + 1)))
            New-Item -ItemType Directory -Force $to | Out-Null
            Copy-Item $pdb.FullName $to
            $count++
          }
          Write-Host "$count PDB(s)"
          if ($count -lt 5) { throw 'Fewer PDBs than expected' }
          Push-Location "$env:RUNNER_TEMP\symbols"
          7z @pack "$env:RUNNER_TEMP\${{ steps.tag.outputs.symbols }}" * | Select-Object -Last 3
          if ($LASTEXITCODE) { throw '7z failed' }
          Pop-Location
          foreach ($file in '${{ steps.tag.outputs.archive }}', '${{ steps.tag.outputs.symbols }}') {
            $size = (Get-Item "$env:RUNNER_TEMP\$file").Length
            Write-Host ("{0}: {1:N0} MB" -f $file, ($size / 1MB))
            if ($size -ge 2GB) { throw "$file is over GitHub's 2 GiB per-asset limit" }
          }

      - name: Attach to the release
        run: |
          gh release upload $env:TAG "$env:RUNNER_TEMP\${{ steps.tag.outputs.archive }}" `
            "$env:RUNNER_TEMP\${{ steps.tag.outputs.symbols }}" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'attaching the archives failed' }

  # The same on Ubuntu 24.04 (docs/LINUX_WSL.md): a tar.xz, which keeps the
  # libraries' links and the programs' modes, of a folder that runs from
  # wherever it is unpacked. No PySide6 yet, so no V-Ray Render and no
  # Python-made panels on Linux.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::The tag '$TAG' isn't a version, such as 0.2.0, v0.2.0 or 0.2.0-beta.1."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "::error::There's no release with the tag $TAG to attach the archives to."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=usdcc-$version" >> "$GITHUB_OUTPUT"
          echo "tarball=usdcc-$version-linux-x64.tar.xz" >> "$GITHUB_OUTPUT"
          echo "symbols=usdcc-$version-linux-x64-symbols.tar.xz" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          submodules: recursive

      # As build.yml: the Blender mesh backend's eigen3 override makes vcpkg
      # read older port history than the depth-1 submodule clone has.
      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # As build.yml's linux job, and patchelf for the deploy.
      - name: Install the build's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build pkg-config autoconf autoconf-archive automake libltdl-dev \
            libtool bison flex gperf nasm zip unzip xvfb mesa-utils patchelf \
            libgl-dev libegl-dev libegl1-mesa-dev libglu1-mesa-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxi-dev libxt-dev libxtst-dev libxrandr-dev libxcursor-dev libxinerama-dev libsm-dev libice-dev \
            libxkbcommon-dev libxkbcommon-x11-dev '^libxcb.*-dev' libfontconfig1-dev libfreetype-dev libdbus-1-dev \
            libwayland-dev wayland-protocols libwayland-bin

      - name: Name the OpenUSD asset
        id: asset
        run: python3 tools/ci/usd_asset.py --github-output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Download OpenUSD
        run: |
          if ! gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir "$RUNNER_TEMP"; then
            echo "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deps"  # unzip makes only the last folder
          unzip -q "$RUNNER_TEMP/${{ steps.asset.outputs.zip }}" -d "$RUNNER_TEMP/deps/usd"
          echo "USD_INSTALL=$RUNNER_TEMP/deps/usd" >> "$GITHUB_ENV"

      # build.yml's cache, only read: build.yml keeps it.
      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py --access read

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Build
        run: python tools/build.py --usd-install "$USD_INSTALL" --without-rtx --usdcc-version ${{ steps.tag.outputs.version }}

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir build --output-on-failure --timeout 900

      # The deploy checks itself: every library loads from it or the system,
      # and its Python imports pxr and usdcc from it. Then usdcc's own debug
      # info goes into the symbols folder, laid out as the deploy is.
      - name: Deploy
        run: |
          deploy="$RUNNER_TEMP/${{ steps.tag.outputs.name }}"
          python tools/deploy.py "$deploy"
          # A release has to ship every licence (docs/RELEASE.md section 6).
          for folder in OpenUSD-dependencies vcpkg Python; do
            if [ -z "$(ls -A "$deploy/licenses/$folder" 2>/dev/null)" ]; then
              echo "::error::No licences in licenses/$folder"; exit 1
            fi
          done
          python tools/ci/split_debug.py --deploy "$deploy" --symbols "$RUNNER_TEMP/symbols/${{ steps.tag.outputs.name }}"

      - name: Start the deploy
        run: |
          python tools/ci/smoke_test.py --deploy "$RUNNER_TEMP/${{ steps.tag.outputs.name }}" \
            --expect-version ${{ steps.tag.outputs.version }}

      # The symbols' top folder is the deploy's name: unpacked where the release
      # was, each .debug file lands next to its binary, where gdb looks. xz at
      # its strongest (-9e, a 64 MB dictionary); -T0 uses every core, in 192 MB
      # blocks, which costs about 1% in size. `tar -xf` unpacks it as it is.
      - name: Pack it
        run: |
          tar -C "$RUNNER_TEMP" -cf - '${{ steps.tag.outputs.name }}' | xz -9e -T0 > "$RUNNER_TEMP/${{ steps.tag.outputs.tarball }}"
          tar -C "$RUNNER_TEMP/symbols" -cf - '${{ steps.tag.outputs.name }}' | xz -9e -T0 > "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}"
          for file in '${{ steps.tag.outputs.tarball }}' '${{ steps.tag.outputs.symbols }}'; do
            size=$(stat -c %s "$RUNNER_TEMP/$file")
            echo "$file: $((size / 1048576)) MB"
            if [ "$size" -ge 2147483648 ]; then echo "::error::$file is over GitHub's 2 GiB per-asset limit"; exit 1; fi
          done

      - name: Attach to the release
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/${{ steps.tag.outputs.tarball }}" \
            "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}" --clobber --repo "$GITHUB_REPOSITORY"
