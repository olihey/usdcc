# Builds a GitHub release's Windows 7z, Linux tar.xz and macOS dmg and attaches them
# (docs/RELEASE.md §4): publish a release (or prerelease) with a tag such as
# 26.12.1, and this builds that tag on each platform, x64 and arm64, runs the
# tests, deploys, starts the deploy as a user would, and attaches
# usdcc-<version>-windows-<arch>.7z, usdcc-<version>-linux-<arch>.tar.xz and
# usdcc-<version>-macos-arm64.dmg, each with its symbols, and on Windows the installer (usdcc-win-Setup.exe for x64,
# usdcc-win-arm64-Setup.exe) and the packages installs update from
# (docs/UPDATES.md). Run it by hand with the tag to rebuild a release whose run
# failed, or with dry_run to try the branch it's run on: built and packed as for
# that tag's version, but nothing attached (docs/ARM64_RELEASES.md).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as 26.12.1
        required: true
        type: string
      dry_run:
        description: Build the branch this runs on, as for the tag's version, and attach nothing
        type: boolean
        default: false

permissions:
  contents: write  # attaching the archives

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  # x64 and arm64, as build.yml's windows job: Visual Studio 2022 on x64, 2026 on
  # GitHub's windows-11-arm runner, and tools/_common.py picks the triplet and the
  # assets by the machine. Each is a Velopack channel of its own: x64 keeps win,
  # the one installs from before arm64 read, and arm64 is win-arm64.
  windows:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-2022
            arch: x64
            triplet: x64-windows
            channel: ''
          - name: windows-arm64
            runner: windows-11-arm
            arch: arm64
            triplet: arm64-windows
            channel: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      USD_INSTALL: C:\deps\usd
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          # YY.MM.N (docs/UPDATES.md §5). A year in full, 2026.12.1, would be higher
          # than every YY.MM.N there will be, to each install.
          if ($env:TAG -notmatch '^v?(\d\d\.([1-9]|1[0-2])\.[1-9]\d*(-[0-9A-Za-z.-]+)?)$') {
            Write-Host "::error::The tag '$env:TAG' isn't a version (YY.MM.N), such as 26.12.1, v26.12.1 or 26.12.1-beta.1."
            exit 1
          }
          $version = $Matches[1]
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          if ($LASTEXITCODE) {
            Write-Host "::error::There's no release with the tag $env:TAG to attach the archives to."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=usdcc-$version" >> $env:GITHUB_OUTPUT
          "archive=usdcc-$version-windows-${{ matrix.arch }}.7z" >> $env:GITHUB_OUTPUT
          "symbols=usdcc-$version-windows-${{ matrix.arch }}-symbols.7z" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          # A dry run builds the branch it was run on.
          ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', env.TAG) }}
          submodules: recursive

      # As build.yml: the Blender mesh backend's eigen3 override makes vcpkg
      # read older port history than the depth-1 submodule clone has.
      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      # The tools run on the image's own Python before setup-python; on the Arm
      # image that has to be an arm64 one, or they'd name the x64 assets.
      # Any arm64 Python 3.9+ does; the pinned one is set up after (see below).
      - name: Set up Python for the tools
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Name the OpenUSD asset
        id: asset
        run: python tools/ci/usd_asset.py --github-output

      # The Python OpenUSD was built with: its pxrConfig.cmake points at this
      # exact interpreter, and usdcc embeds the same one.
      - name: Set up Python
        if: matrix.arch == 'x64'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}
          architecture: x64

      # On the Arm image setup-python can't install the pinned 3.13: the image
      # ships a newer 3.13, and Python's installer won't put an older one beside
      # it, even with the image's uninstalled. python.org's NuGet package of the
      # same version is a plain archive, unpacked where setup-python would put it.
      - name: Set up Python (arm64, from python.org's NuGet package)
        if: matrix.arch == 'arm64'
        run: |
          $version = '${{ steps.asset.outputs.python }}'
          $dir = "$env:RUNNER_TOOL_CACHE\Python\$version\arm64"
          if (-not (Test-Path "$dir\python.exe")) {
            $zip = "$env:RUNNER_TEMP\pythonarm64.$version.zip"
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/pythonarm64/$version/pythonarm64.$version.nupkg" -OutFile $zip
            Expand-Archive $zip "$env:RUNNER_TEMP\pythonarm64" -Force
            New-Item -ItemType Directory -Force (Split-Path $dir) | Out-Null
            Move-Item "$env:RUNNER_TEMP\pythonarm64\tools" $dir
            Remove-Item -Recurse -Force $zip, "$env:RUNNER_TEMP\pythonarm64"
          }
          & "$dir\python.exe" -m ensurepip --upgrade --default-pip | Select-Object -Last 1
          if ($LASTEXITCODE) { throw 'ensurepip failed' }
          # As setup-python does: first on PATH, and where CMake's FindPython looks.
          Add-Content $env:GITHUB_PATH "$dir\Scripts"
          Add-Content $env:GITHUB_PATH $dir
          "pythonLocation=$dir", "Python_ROOT_DIR=$dir", "Python3_ROOT_DIR=$dir" | Add-Content $env:GITHUB_ENV
          & "$dir\python.exe" -c "import platform, sys; print(sys.version, platform.machine())"

      - name: Download OpenUSD
        run: |
          gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) {
            Write-Host "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) first."
            exit 1
          }
          7z x "$env:RUNNER_TEMP\${{ steps.asset.outputs.zip }}" "-o$env:USD_INSTALL" | Select-Object -Last 2
          if ($LASTEXITCODE) { throw 'unzipping failed' }

      # Required here, unlike in build.yml: a release has every USD plugin pack
      # of the standard set (docs/USD_PLUGINS.md section 5).
      - name: Download the USD plugin packs
        run: |
          python tools/fetch_usd.py $env:USD_INSTALL --packs-only --require-packs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Required here, unlike in build.yml: a release without it couldn't make
      # panels from Python.
      - name: Download PySide6
        run: |
          $asset = python tools/ci/pyside_asset.py | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download $asset.tag --pattern $asset.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) {
            Write-Host "::error::No $($asset.zip) in release $($asset.tag). Run the PySide6 workflow (deps-pyside.yml) first."
            exit 1
          }
          7z x "$env:RUNNER_TEMP\$($asset.zip)" -oexternal | Select-Object -Last 2
          if ($LASTEXITCODE) { throw 'unzipping failed' }

      # build.yml's cache, only read: build.yml keeps it.
      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py --access read

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Build
        run: python tools/build.py --usd-install $env:USD_INSTALL --without-rtx --usdcc-version ${{ steps.tag.outputs.version }}

      - name: Test
        run: |
          ctest --test-dir build -C RelWithDebInfo --output-on-failure --timeout 900
          if ($LASTEXITCODE) { throw 'tests failed' }

      # For the VS Code extension, which the deploy has (docs/VSCODE.md).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Deploy
        run: |
          $deploy = "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}"
          python tools/deploy.py $deploy --require-vsix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A release has to ship every licence (docs/RELEASE.md section 6).
          foreach ($folder in 'OpenUSD-dependencies', 'PySide6', 'vcpkg') {
            if (-not (Get-ChildItem "$deploy\licenses\$folder" -ErrorAction SilentlyContinue)) {
              throw "No licences in licenses\$folder"
            }
          }

      - name: Start the deploy
        run: |
          python tools/ci/smoke_test.py --deploy "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}" `
            --expect-version ${{ steps.tag.outputs.version }} --expect-standard-usd-packs `
            --platform-plugins build\vcpkg_installed\${{ matrix.triplet }}\Qt6\plugins\platforms

      # The deploy, in a folder of its own; and the PDBs of usdcc's own
      # programs and libraries, laid out as they are in the deploy, for reading
      # a crash dump from that release. 7z at its strongest: LZMA2 with a
      # 256 MB dictionary, one solid block with the files sorted by type, so
      # the DLLs compress against each other (7-Zip adds its x86 filter for
      # them). Unpacking takes about 256 MB of memory.
      - name: Pack it
        run: |
          $pack = @('a', '-t7z', '-mx=9', '-md=256m', '-mfb=273', '-ms=on', '-mqs=on', '-mmt=on')
          $deploy = "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}"
          Push-Location $env:RUNNER_TEMP
          7z @pack '${{ steps.tag.outputs.archive }}' '${{ steps.tag.outputs.name }}' | Select-Object -Last 3
          if ($LASTEXITCODE) { throw '7z failed' }
          Pop-Location

          $symbols = "$env:RUNNER_TEMP\symbols\${{ steps.tag.outputs.name }}-symbols"
          $pdbs = @(Get-ChildItem build -Recurse -Filter *.pdb |
            Where-Object { $_.FullName -notmatch '\\(vcpkg_installed|CMakeFiles|tests)\\' -and $_.FullName -notmatch '\.dir\\' })
          $count = 0
          foreach ($binary in Get-ChildItem $deploy -Recurse -Include *.exe, *.dll, *.pyd) {
            # OpenUSD's pxr has an _usd.pyd too; of the Python packages, only usdcc's are ours.
            if ($binary.FullName -match '\\site-packages\\' -and $binary.FullName -notmatch '\\site-packages\\usdcc\\') { continue }
            # The launcher at the top has the app's name and a PDB of its own (docs/UPDATES.md §3).
            $name = if ($binary.DirectoryName -eq $deploy -and $binary.Name -eq 'usdcc.exe') { 'usdcc_launcher' } else { $binary.BaseName }
            $pdb = $pdbs | Where-Object { $_.BaseName -eq $name } | Select-Object -First 1
            if (-not $pdb) { continue }
            $to = Join-Path $symbols ([IO.Path]::GetDirectoryName($binary.FullName.Substring($deploy.Length + 1)))
            New-Item -ItemType Directory -Force $to | Out-Null
            Copy-Item $pdb.FullName $to
            $count++
          }
          Write-Host "$count PDB(s)"
          if ($count -lt 5) { throw 'Fewer PDBs than expected' }
          Push-Location "$env:RUNNER_TEMP\symbols"
          7z @pack "$env:RUNNER_TEMP\${{ steps.tag.outputs.symbols }}" * | Select-Object -Last 3
          if ($LASTEXITCODE) { throw '7z failed' }
          Pop-Location
          foreach ($file in '${{ steps.tag.outputs.archive }}', '${{ steps.tag.outputs.symbols }}') {
            $size = (Get-Item "$env:RUNNER_TEMP\$file").Length
            Write-Host ("{0}: {1:N0} MB" -f $file, ($size / 1MB))
            if ($size -ge 2GB) { throw "$file is over GitHub's 2 GiB per-asset limit" }
          }

      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release upload $env:TAG "$env:RUNNER_TEMP\${{ steps.tag.outputs.archive }}" `
            "$env:RUNNER_TEMP\${{ steps.tag.outputs.symbols }}" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'attaching the archives failed' }

      # The installer and the update packages (docs/UPDATES.md §5), from the same
      # deploy, with Velopack's vpk at the version cmake/modules/UsdccVelopack.cmake
      # pins (the runner's .NET SDK installs it). The latest earlier release's full
      # package comes down first, so vpk can make a delta from it: what an install of
      # that version downloads to update. The first release with packages has none.
      # vpk then attaches usdcc-win-Setup.exe, the full and delta packages and the
      # feed (releases.win.json) to this release, which installs look for; arm64's
      # are its channel's (usdcc-win-arm64-Setup.exe, releases.win-arm64.json), and
      # an install only ever reads its own channel's feed. A dry run attaches
      # nothing, and keeps the installer with the run for a few days. The
      # package id usdcc installs into %LOCALAPPDATA%\usdcc, which Velopack owns
      # and empties on uninstall; the user's files are in %LOCALAPPDATA%\usdcc_config.
      - name: Make the installer and the update packages
        run: |
          $vpkVersion = (Select-String -Path cmake/modules/UsdccVelopack.cmake `
            -Pattern 'set\(USDCC_VELOPACK_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
          dotnet tool install vpk --version $vpkVersion --tool-path "$env:RUNNER_TEMP\vpk"
          if ($LASTEXITCODE) { throw 'installing vpk failed' }
          Set-Alias vpk "$env:RUNNER_TEMP\vpk\vpk.exe"
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          $releases = "$env:RUNNER_TEMP\velopack"
          New-Item -ItemType Directory -Force $releases | Out-Null
          # A prerelease (26.12.1-beta.1) updates from, and is offered to, prereleases too.
          $pre = if ('${{ steps.tag.outputs.version }}' -match '-') { @('--pre') } else { @() }
          $channel = if ('${{ matrix.channel }}') { @('--channel', '${{ matrix.channel }}') } else { @() }
          vpk download github --repoUrl $repo --token $env:GH_TOKEN --outputDir $releases @pre @channel
          if ($LASTEXITCODE) { Write-Host "::notice::No earlier release with update packages, so no delta this time." }
          vpk pack --packId usdcc --packVersion '${{ steps.tag.outputs.version }}' --packTitle usdcc --packAuthors usdcc `
            --packDir "$env:RUNNER_TEMP\${{ steps.tag.outputs.name }}" --mainExe usdcc.exe `
            --runtime win-${{ matrix.arch }} --icon src/cpp/app/resources/usdcc.ico --noPortable --outputDir $releases @channel
          if ($LASTEXITCODE) { throw 'vpk pack failed' }
          Get-ChildItem $releases | ForEach-Object { Write-Host ("{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB)) }
          if ('${{ inputs.dry_run }}' -eq 'true') { exit 0 }
          vpk upload github --repoUrl $repo --token $env:GH_TOKEN --outputDir $releases --tag $env:TAG --merge @pre @channel
          if ($LASTEXITCODE) { throw 'attaching the installer and update packages failed' }

      - name: Keep the installer with the run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ runner.temp }}/velopack/*Setup.exe
          retention-days: 3

  # The same on Ubuntu 24.04 (docs/LINUX_WSL.md), x64 and arm64: a tar.xz, which
  # keeps the libraries' links and the programs' modes, of a folder that runs
  # from wherever it is unpacked.
  linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
            arch: x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          # YY.MM.N, as the windows job checks it.
          if ! [[ "$TAG" =~ ^v?([0-9][0-9]\.([1-9]|1[0-2])\.[1-9][0-9]*(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::The tag '$TAG' isn't a version (YY.MM.N), such as 26.12.1, v26.12.1 or 26.12.1-beta.1."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "::error::There's no release with the tag $TAG to attach the archives to."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=usdcc-$version" >> "$GITHUB_OUTPUT"
          echo "tarball=usdcc-$version-linux-${{ matrix.arch }}.tar.xz" >> "$GITHUB_OUTPUT"
          echo "symbols=usdcc-$version-linux-${{ matrix.arch }}-symbols.tar.xz" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A dry run builds the branch it was run on.
          ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', env.TAG) }}
          submodules: recursive

      # As build.yml: the Blender mesh backend's eigen3 override makes vcpkg
      # read older port history than the depth-1 submodule clone has.
      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # As build.yml's linux job, and patchelf for the deploy.
      - name: Install the build's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build pkg-config autoconf autoconf-archive automake libltdl-dev \
            libtool bison flex gperf nasm zip unzip xvfb mesa-utils patchelf \
            libgl-dev libegl-dev libegl1-mesa-dev libglu1-mesa-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxi-dev libxt-dev libxtst-dev libxrandr-dev libxcursor-dev libxinerama-dev libsm-dev libice-dev \
            libxkbcommon-dev libxkbcommon-x11-dev '^libxcb.*-dev' libfontconfig1-dev libfreetype-dev libdbus-1-dev \
            libwayland-dev wayland-protocols libwayland-bin

      - name: Name the OpenUSD asset
        id: asset
        run: python3 tools/ci/usd_asset.py --github-output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.asset.outputs.python }}

      - name: Download OpenUSD
        run: |
          if ! gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir "$RUNNER_TEMP"; then
            echo "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deps"  # unzip makes only the last folder
          unzip -q "$RUNNER_TEMP/${{ steps.asset.outputs.zip }}" -d "$RUNNER_TEMP/deps/usd"
          echo "USD_INSTALL=$RUNNER_TEMP/deps/usd" >> "$GITHUB_ENV"

      # Required, as in the windows job: a release has every USD plugin pack of
      # the standard set for its platform (docs/USD_PLUGINS.md section 5), and the
      # published ones of the optional set (MoonRay), each a download of its own.
      - name: Download the USD plugin packs
        run: python tools/fetch_usd.py "$RUNNER_TEMP/deps/usd" --packs-only --require-packs --optional

      # Required, as in the windows job.
      - name: Download PySide6
        run: |
          python tools/ci/pyside_asset.py > "$RUNNER_TEMP/pyside.json"
          tag=$(jq -r .tag "$RUNNER_TEMP/pyside.json"); zip=$(jq -r .zip "$RUNNER_TEMP/pyside.json")
          if ! gh release download "$tag" --pattern "$zip" --dir "$RUNNER_TEMP"; then
            echo "::error::No $zip in release $tag. Run the PySide6 workflow (deps-pyside.yml) first."
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/$zip" -d external
          rm "$RUNNER_TEMP/$zip"

      # build.yml's cache, only read: build.yml keeps it.
      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py --access read

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Build
        run: python tools/build.py --usd-install "$USD_INSTALL" --without-rtx --usdcc-version ${{ steps.tag.outputs.version }}

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir build --output-on-failure --timeout 900

      # The deploy checks itself: every library loads from it or the system,
      # and its Python imports pxr and usdcc from it. Then usdcc's own debug
      # info goes into the symbols folder, laid out as the deploy is.
      # For the VS Code extension, which the deploy has (docs/VSCODE.md).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Deploy
        run: |
          deploy="$RUNNER_TEMP/${{ steps.tag.outputs.name }}"
          # The optional packs go to optional/<pack>/<deploy's name>/, out of the deploy.
          python tools/deploy.py "$deploy" --require-vsix --optional-packs "$RUNNER_TEMP/optional"
          # A release has to ship every licence (docs/RELEASE.md section 6).
          for folder in OpenUSD-dependencies PySide6 vcpkg Python; do
            if [ -z "$(ls -A "$deploy/licenses/$folder" 2>/dev/null)" ]; then
              echo "::error::No licences in licenses/$folder"; exit 1
            fi
          done
          python tools/ci/split_debug.py --deploy "$deploy" --symbols "$RUNNER_TEMP/symbols/${{ steps.tag.outputs.name }}"

      - name: Start the deploy
        run: |
          python tools/ci/smoke_test.py --deploy "$RUNNER_TEMP/${{ steps.tag.outputs.name }}" \
            --expect-version ${{ steps.tag.outputs.version }} --expect-standard-usd-packs

      # The symbols' top folder is the deploy's name: unpacked where the release
      # was, each .debug file lands next to its binary, where gdb looks. xz at
      # its strongest (-9e, a 64 MB dictionary); -T0 uses every core, in 192 MB
      # blocks, which costs about 1% in size. `tar -xf` unpacks it as it is.
      - name: Pack it
        run: |
          tar -C "$RUNNER_TEMP" -cf - '${{ steps.tag.outputs.name }}' | xz -9e -T0 > "$RUNNER_TEMP/${{ steps.tag.outputs.tarball }}"
          tar -C "$RUNNER_TEMP/symbols" -cf - '${{ steps.tag.outputs.name }}' | xz -9e -T0 > "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}"
          for file in '${{ steps.tag.outputs.tarball }}' '${{ steps.tag.outputs.symbols }}'; do
            size=$(stat -c %s "$RUNNER_TEMP/$file")
            echo "$file: $((size / 1048576)) MB"
            if [ "$size" -ge 2147483648 ]; then echo "::error::$file is over GitHub's 2 GiB per-asset limit"; exit 1; fi
          done

      # Each optional pack (docs/USD_PLUGINS.md section 5) is checked unpacked over the
      # deploy, which is packed by now, and becomes usdcc-<version>-linux-<arch>-<pack>.tar.xz,
      # whose top folder is the deploy's name: unpacked where usdcc was, it lands in it.
      - name: Check and pack the optional USD plugin packs
        run: |
          mkdir -p "$RUNNER_TEMP/optional-archives"
          deploy="$RUNNER_TEMP/${{ steps.tag.outputs.name }}"
          for folder in "$RUNNER_TEMP"/optional/*/; do
            [ -d "$folder" ] || continue
            pack=$(basename "$folder")
            cp -a "$folder/${{ steps.tag.outputs.name }}/." "$deploy/"
            python tools/ci/smoke_test.py --deploy "$deploy" --expect-version ${{ steps.tag.outputs.version }}
            file="${{ steps.tag.outputs.name }}-linux-${{ matrix.arch }}-$pack.tar.xz"
            tar -C "$folder" -cf - '${{ steps.tag.outputs.name }}' | xz -9e -T0 > "$RUNNER_TEMP/optional-archives/$file"
            size=$(stat -c %s "$RUNNER_TEMP/optional-archives/$file")
            echo "$file: $((size / 1048576)) MB"
            if [ "$size" -ge 2147483648 ]; then echo "::error::$file is over GitHub's 2 GiB per-asset limit"; exit 1; fi
          done
          ls -la "$RUNNER_TEMP/optional-archives"

      - name: Keep the archive with the run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tarball }}
          path: |
            ${{ runner.temp }}/${{ steps.tag.outputs.tarball }}
            ${{ runner.temp }}/optional-archives/
          compression-level: 0
          retention-days: 3

      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        run: |
          shopt -s nullglob  # arm64 has no optional pack
          gh release upload "$TAG" "$RUNNER_TEMP/${{ steps.tag.outputs.tarball }}" \
            "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}" "$RUNNER_TEMP"/optional-archives/*.tar.xz \
            --clobber --repo "$GITHUB_REPOSITORY"

      # The AppImage, which updates itself (docs/UPDATES.md section 9), from the deploy that
      # is packed by now. Out of the deploy again: the optional packs checked above. vpk names
      # the file usdcc-linux-<arch>.AppImage, and the packages and the feed by the channel.
      # .NET was removed above, for the space.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Make the AppImage and its update packages
        run: |
          sudo apt-get install -y -q squashfs-tools
          mkdir "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xf "$RUNNER_TEMP/${{ steps.tag.outputs.tarball }}"
          python tools/make_appdir.py --move "$RUNNER_TEMP/unpacked/${{ steps.tag.outputs.name }}" "$RUNNER_TEMP/usdcc.AppDir"
          vpk_version=$(sed -n 's/^set(USDCC_VELOPACK_VERSION "\([^"]*\)").*/\1/p' cmake/modules/UsdccVelopack.cmake)
          dotnet tool install vpk --version "$vpk_version" --tool-path "$RUNNER_TEMP/vpk"
          repo="https://github.com/$GITHUB_REPOSITORY"
          releases="$RUNNER_TEMP/velopack"
          mkdir -p "$releases"
          pre=()
          if [[ '${{ steps.tag.outputs.version }}' == *-* ]]; then pre=(--pre); fi
          channel='linux-${{ matrix.arch }}'
          "$RUNNER_TEMP/vpk/vpk" download github --repoUrl "$repo" --token "$GH_TOKEN" --outputDir "$releases" --channel "$channel" "${pre[@]}" \
            || echo "::notice::No earlier release with update packages, so no delta this time."
          "$RUNNER_TEMP/vpk/vpk" pack --packId usdcc --packVersion '${{ steps.tag.outputs.version }}' --packTitle usdcc --packAuthors usdcc \
            --packDir "$RUNNER_TEMP/usdcc.AppDir" --mainExe usdcc --runtime "$channel" --channel "$channel" --outputDir "$releases"
          ls -la "$releases"

      # Without FUSE, which the runner doesn't need to have.
      - name: Start the AppImage
        run: |
          image="$RUNNER_TEMP/velopack/usdcc-linux-${{ matrix.arch }}.AppImage"
          "$image" --appimage-extract-and-run usdcc_node --version --no-gpu | tee "$RUNNER_TEMP/node.txt"
          grep -q 'usdcc_node ${{ steps.tag.outputs.version }}' "$RUNNER_TEMP/node.txt"
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract > /dev/null)
          python tools/ci/smoke_test.py --deploy "$RUNNER_TEMP/squashfs-root/usr" \
            --expect-version ${{ steps.tag.outputs.version }} --expect-standard-usd-packs

      - name: Keep the AppImage with the run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.name }}
          path: ${{ runner.temp }}/velopack/*.AppImage
          compression-level: 0
          retention-days: 3

      - name: Attach the AppImage and its update packages
        if: ${{ !inputs.dry_run }}
        run: |
          pre=()
          if [[ '${{ steps.tag.outputs.version }}' == *-* ]]; then pre=(--pre); fi
          "$RUNNER_TEMP/vpk/vpk" upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --outputDir "$RUNNER_TEMP/velopack" --tag "$TAG" --merge --channel 'linux-${{ matrix.arch }}' "${pre[@]}"

  # macOS on Apple Silicon (docs/MACOS.md): usdcc.app in a disk image. Signed ad hoc, so
  # macOS asks whoever downloads it (docs/RELEASE.md section 4), unless the secret
  # MACOS_SIGN_IDENTITY names an identity. That also needs its certificate imported into a
  # keychain and the disk image notarized, which aren't here yet.
  macos:
    runs-on: macos-15
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SIGN: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
      VCPKG_DISABLE_METRICS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          # YY.MM.N, as the windows job checks it.
          if ! [[ "$TAG" =~ ^v?([0-9][0-9]\.([1-9]|1[0-2])\.[1-9][0-9]*(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::The tag '$TAG' isn't a version (YY.MM.N), such as 26.12.1, v26.12.1 or 26.12.1-beta.1."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "::error::There's no release with the tag $TAG to attach the archives to."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=usdcc-$version" >> "$GITHUB_OUTPUT"
          echo "dmg=usdcc-$version-macos-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "symbols=usdcc-$version-macos-arm64-symbols.tar.xz" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A dry run builds the branch it was run on.
          ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', env.TAG) }}
          submodules: recursive

      - name: Fetch vcpkg's full history
        run: git -C external/vcpkg fetch --unshallow --no-tags origin

      - name: Install the build's packages
        run: brew install --quiet ninja pkg-config autoconf autoconf-archive automake libtool uv xz

      - name: Name the OpenUSD asset
        id: asset
        run: python3 tools/ci/usd_asset.py --github-output

      # uv's Python, as in build.yml's macos job: the same path in every workflow.
      - name: Set up Python
        run: |
          uv python install '${{ steps.asset.outputs.python }}'
          python=$(uv python find --no-project --managed-python '${{ steps.asset.outputs.python }}')
          dirname "$python" >> "$GITHUB_PATH"
          "$python" -c "import platform, sys; print(sys.version, platform.machine(), sys.prefix)"

      - name: Download OpenUSD
        run: |
          if ! gh release download '${{ steps.asset.outputs.tag }}' --pattern '${{ steps.asset.outputs.zip }}' --dir "$RUNNER_TEMP"; then
            echo "::error::No ${{ steps.asset.outputs.zip }} in release ${{ steps.asset.outputs.tag }}. Run the OpenUSD workflow (deps-usd.yml) first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/deps"  # unzip makes only the last folder
          unzip -q "$RUNNER_TEMP/${{ steps.asset.outputs.zip }}" -d "$RUNNER_TEMP/deps/usd"
          echo "USD_INSTALL=$RUNNER_TEMP/deps/usd" >> "$GITHUB_ENV"

      # Required, as in the windows job; the optional ones (MoonRay) too, as on Linux.
      - name: Download the USD plugin packs
        run: python tools/fetch_usd.py "$RUNNER_TEMP/deps/usd" --packs-only --require-packs --optional

      - name: Download PySide6
        run: |
          python tools/ci/pyside_asset.py > "$RUNNER_TEMP/pyside.json"
          tag=$(jq -r .tag "$RUNNER_TEMP/pyside.json"); zip=$(jq -r .zip "$RUNNER_TEMP/pyside.json")
          if ! gh release download "$tag" --pattern "$zip" --dir "$RUNNER_TEMP"; then
            echo "::error::No $zip in release $tag. Run the PySide6 workflow (deps-pyside.yml) first."
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/$zip" -d external

      # build.yml's cache, only read: build.yml keeps it.
      - name: Name the vcpkg cache
        id: vcpkg
        run: python tools/ci/vcpkg_cache.py --access read

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.dir }}
          key: ${{ steps.vcpkg.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg.outputs.deps }}
            ${{ steps.vcpkg.outputs.any }}

      - name: Build
        run: python tools/build.py --usd-install "$USD_INSTALL" --without-rtx --usdcc-version ${{ steps.tag.outputs.version }}

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900

      # For the VS Code extension, which the deploy has (docs/VSCODE.md).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # The deploy checks itself, as on Linux. The symbols come out before anything is
      # made of it: the binaries are signed again without them.
      - name: Deploy
        run: |
          deploy="$RUNNER_TEMP/${{ steps.tag.outputs.name }}"
          python tools/deploy.py "$deploy" --sign "$SIGN" --require-vsix --optional-packs "$RUNNER_TEMP/optional"
          # A release has to ship every licence (docs/RELEASE.md section 6).
          for folder in OpenUSD-dependencies PySide6 vcpkg Python; do
            if [ -z "$(ls -A "$deploy/usdcc.app/Contents/Resources/licenses/$folder" 2>/dev/null)" ]; then
              echo "::error::No licences in licenses/$folder"; exit 1
            fi
          done
          python tools/ci/split_dsym.py --deploy "$deploy" --symbols "$RUNNER_TEMP/symbols/${{ steps.tag.outputs.name }}" --sign "$SIGN"
          # Each optional pack's usdcc.app has the same binaries, so these symbols aren't kept.
          for folder in "$RUNNER_TEMP"/optional/*/; do
            [ -d "$folder" ] || continue
            python tools/ci/split_dsym.py --deploy "$folder/${{ steps.tag.outputs.name }}" --symbols "$RUNNER_TEMP/symbols-again" --sign "$SIGN"
            rm -rf "$RUNNER_TEMP/symbols-again"
          done

      # The update packages (docs/UPDATES.md section 9). vpk puts its updater into usdcc.app and
      # signs the bundle again, so the app in the disk image is the one it puts out. An app
      # with an optional pack isn't packed: an update would take its pack away.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Make the update packages
        run: |
          vpk_version=$(sed -n 's/^set(USDCC_VELOPACK_VERSION "\([^"]*\)").*/\1/p' cmake/modules/UsdccVelopack.cmake)
          dotnet tool install vpk --version "$vpk_version" --tool-path "$RUNNER_TEMP/vpk"
          repo="https://github.com/$GITHUB_REPOSITORY"
          releases="$RUNNER_TEMP/velopack"
          mkdir -p "$releases"
          pre=()
          if [[ '${{ steps.tag.outputs.version }}' == *-* ]]; then pre=(--pre); fi
          "$RUNNER_TEMP/vpk/vpk" download github --repoUrl "$repo" --token "$GH_TOKEN" --outputDir "$releases" --channel osx-arm64 ${pre[@]+"${pre[@]}"} \
            || echo "::notice::No earlier release with update packages, so no delta this time."
          # vpk takes only this extension.
          cp src/cpp/app/resources/macos/entitlements.plist "$RUNNER_TEMP/usdcc.entitlements"
          deploy="$RUNNER_TEMP/${{ steps.tag.outputs.name }}"
          "$RUNNER_TEMP/vpk/vpk" pack --packId usdcc --packVersion '${{ steps.tag.outputs.version }}' --packTitle usdcc --packAuthors usdcc \
            --packDir "$deploy/usdcc.app" --mainExe usdcc --runtime osx-arm64 --channel osx-arm64 --noInst \
            --signAppIdentity "$SIGN" --signDisableDeep --signEntitlements "$RUNNER_TEMP/usdcc.entitlements" --outputDir "$releases"
          ls -la "$releases"
          mkdir "$RUNNER_TEMP/packed"
          ditto -x -k "$releases/usdcc-osx-arm64-Portable.zip" "$RUNNER_TEMP/packed"
          test -x "$RUNNER_TEMP/packed/usdcc.app/Contents/MacOS/UpdateMac"
          codesign --verify --deep --strict "$RUNNER_TEMP/packed/usdcc.app"
          # As an update installs it: out of the package, over an installed one, links and signature intact.
          mkdir "$RUNNER_TEMP/updated"
          ditto "$RUNNER_TEMP/packed/usdcc.app" "$RUNNER_TEMP/updated/usdcc.app"
          rm "$RUNNER_TEMP/updated/usdcc.app/Contents/Resources/LICENSE.txt"
          package=$(ls "$releases"/usdcc-*-full.nupkg | grep -F -- '-${{ steps.tag.outputs.version }}-')
          "$RUNNER_TEMP/updated/usdcc.app/Contents/MacOS/UpdateMac" --silent apply --norestart --package "$package"
          test -f "$RUNNER_TEMP/updated/usdcc.app/Contents/Resources/LICENSE.txt"
          codesign --verify --deep --strict "$RUNNER_TEMP/updated/usdcc.app"
          rm -rf "$RUNNER_TEMP/updated" "$deploy/usdcc.app"
          ditto "$RUNNER_TEMP/packed/usdcc.app" "$deploy/usdcc.app"
          # Only for the disk image: out of vpk's list of what to attach.
          list="$releases/assets.osx-arm64.json"
          jq 'map(select(.RelativeFileName | endswith("-Portable.zip") | not))' "$list" > "$list.new"
          mv "$list.new" "$list"
          rm "$releases/usdcc-osx-arm64-Portable.zip"

      # And one for each optional USD plugin pack (docs/USD_PLUGINS.md section 5): usdcc with
      # the pack, as files can't be added to a signed bundle.
      - name: Make the disk images
        run: |
          mkdir "$RUNNER_TEMP/optional-images"
          make_image() {  # <folder with usdcc.app> <disk image>
            rm -rf "$RUNNER_TEMP/image"
            mkdir "$RUNNER_TEMP/image"
            ditto "$1/usdcc.app" "$RUNNER_TEMP/image/usdcc.app"
            ln -s /Applications "$RUNNER_TEMP/image/Applications"
            hdiutil create -volname 'usdcc ${{ steps.tag.outputs.version }}' -srcfolder "$RUNNER_TEMP/image" -format ULMO -ov "$2"
          }
          make_image "$RUNNER_TEMP/${{ steps.tag.outputs.name }}" "$RUNNER_TEMP/${{ steps.tag.outputs.dmg }}"
          for folder in "$RUNNER_TEMP"/optional/*/; do
            [ -d "$folder" ] || continue
            make_image "$folder/${{ steps.tag.outputs.name }}" "$RUNNER_TEMP/optional-images/${{ steps.tag.outputs.name }}-macos-arm64-$(basename "$folder").dmg"
          done
          tar -C "$RUNNER_TEMP/symbols" -cf - '${{ steps.tag.outputs.name }}' | xz -9e -T0 > "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}"
          for file in "$RUNNER_TEMP/${{ steps.tag.outputs.dmg }}" "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}" "$RUNNER_TEMP"/optional-images/*; do
            [ -f "$file" ] || continue
            size=$(stat -f %z "$file")
            echo "$(basename "$file"): $((size / 1048576)) MB"
            if [ "$size" -ge 2147483648 ]; then echo "::error::$file is over GitHub's 2 GiB per-asset limit"; exit 1; fi
          done

      # As whoever downloads it: copied out of the image, with the build, the deploy and
      # OpenUSD moved out of reach.
      - name: Start it from the disk image
        run: |
          mkdir "$RUNNER_TEMP/away"
          mv build external/pyside-install "$RUNNER_TEMP/${{ steps.tag.outputs.name }}" "$USD_INSTALL" "$RUNNER_TEMP/away/"
          if [ -d "$RUNNER_TEMP/optional" ]; then mv "$RUNNER_TEMP/optional" "$RUNNER_TEMP/away/"; fi
          for image in "$RUNNER_TEMP/${{ steps.tag.outputs.dmg }}" "$RUNNER_TEMP"/optional-images/*.dmg; do
            [ -f "$image" ] || continue
            rm -rf "$RUNNER_TEMP/installed"
            mkdir "$RUNNER_TEMP/installed"
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mounted" "$image"
            ditto "$RUNNER_TEMP/mounted/usdcc.app" "$RUNNER_TEMP/installed/usdcc.app"
            hdiutil detach "$RUNNER_TEMP/mounted"
            python tools/ci/smoke_test.py --deploy "$RUNNER_TEMP/installed" \
              --expect-version ${{ steps.tag.outputs.version }} --expect-standard-usd-packs
            codesign --verify --deep --strict "$RUNNER_TEMP/installed/usdcc.app"
          done

      - name: Keep the disk image with the run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.dmg }}
          path: |
            ${{ runner.temp }}/${{ steps.tag.outputs.dmg }}
            ${{ runner.temp }}/optional-images/
          compression-level: 0
          retention-days: 3

      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" "$RUNNER_TEMP/${{ steps.tag.outputs.dmg }}" \
            "$RUNNER_TEMP/${{ steps.tag.outputs.symbols }}" "$RUNNER_TEMP"/optional-images/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          pre=()
          if [[ '${{ steps.tag.outputs.version }}' == *-* ]]; then pre=(--pre); fi
          "$RUNNER_TEMP/vpk/vpk" upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN"             --outputDir "$RUNNER_TEMP/velopack" --tag "$TAG" --merge --channel osx-arm64 ${pre[@]+"${pre[@]}"}
