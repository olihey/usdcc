[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdcc_peers"
version = "1.0.0"
description = "The Peers protocol of usdcc, for programs that aren't usdcc: join and host rooms, send notifications, share state, and run a studio's hub"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["websockets>=14", "PyNaCl>=1.5"]

[project.scripts]
usdcc-hub = "usdcc_peers.hub:main"

[tool.setuptools]
packages = ["usdcc_peers"]
